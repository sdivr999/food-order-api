<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:#f0f7f0;color:#1a3a1a;}
.header{background:#5aaa4a;position:sticky;top:0;z-index:100;}
.header-banner{width:100%;display:block;cursor:pointer;max-height:110px;object-fit:cover;object-position:center;}
.header-bottom{background:#5aaa4a;padding:6px 16px;display:flex;justify-content:space-between;align-items:center;}
.header-sub{font-size:12px;color:#e8f8e8;}
.cart-btn{background:#c8f0a0;border:none;border-radius:50px;padding:7px 14px;font-size:13px;font-weight:500;color:#1a3a1a;cursor:pointer;display:flex;align-items:center;gap:5px;flex-shrink:0;}
.cart-badge{background:#2d6a2d;color:#c8f0a0;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.mode-tabs{display:flex;gap:6px;padding:0 16px 8px;background:#5aaa4a;}
.mode-tab{flex:1;background:transparent;border:1px solid rgba(255,255,255,0.6);color:#fff;border-radius:10px;padding:6px 8px;font-size:13px;cursor:pointer;line-height:1.3;font-family:'Noto Sans TC',sans-serif;}
.mode-tab small{font-size:11px;opacity:0.9;}
.mode-tab.active{background:#fff;color:#2d6a2d;font-weight:700;border-color:#fff;}
.cat-tabs{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;background:#5aaa4a;border-top:1px solid rgba(255,255,255,0.2);}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{background:transparent;border:1px solid rgba(255,255,255,0.5);color:#e8f8e8;border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;white-space:nowrap;}
.cat-tab.active{background:#c8f0a0;border-color:#c8f0a0;color:#1a3a1a;font-weight:500;}
.admin-bar{background:#fff3cd;padding:8px 16px;font-size:14px;color:#856404;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.admin-bar button{background:#856404;color:#fff;border:none;border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer;white-space:nowrap;}
.notice{text-align:center;padding:12px 16px;font-size:14px;line-height:1.6;}
.notice.closed{background:#e53e3e;color:#fff;font-weight:500;}
.notice.pre{background:#e3f2e0;color:#2d6a2d;}
.notice button{margin-top:6px;background:#fff;color:#2d6a2d;border:none;border-radius:20px;padding:6px 16px;font-size:13px;font-weight:700;cursor:pointer;}
.content{padding:12px 16px;max-width:600px;margin:0 auto;}
.section-title{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;color:#2d6a2d;margin:16px 0 6px;padding-bottom:6px;border-bottom:2px solid #a8d8a8;display:flex;justify-content:space-between;align-items:center;}
.add-item-btn{background:#2d6a2d;color:#fff;border:none;border-radius:8px;padding:3px 10px;font-size:11px;cursor:pointer;}
.del-cat-btn{background:#e53e3e;color:#fff;border:none;border-radius:8px;padding:3px 10px;font-size:11px;cursor:pointer;}
.menu-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
.menu-card{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(45,106,45,0.08);border:1px solid #d4ecd4;position:relative;overflow:hidden;}
.menu-card.sold-out{background:#f5f5f5;border-color:#ddd;opacity:0.7;}
.popular-badge{position:absolute;top:0;right:0;background:#4a9e4a;color:#fff;font-size:9px;font-weight:700;padding:2px 8px;border-radius:0 12px 0 8px;}
.sold-out-badge{position:absolute;top:0;right:0;background:#999;color:#fff;font-size:9px;font-weight:700;padding:2px 8px;border-radius:0 12px 0 8px;}
.card-top{display:flex;align-items:center;justify-content:space-between;}
.item-info{flex:1;}
.item-name{font-size:16px;font-weight:500;color:#1a3a1a;margin-bottom:2px;}
.item-name.faded{color:#999;}
.item-desc{font-size:13px;color:#5a7a5a;line-height:1.3;}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;margin-left:10px;}
.item-price{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;color:#2d6a2d;}
.item-price.faded{color:#999;}
.in-cart{font-size:12px;color:#4a9e4a;font-weight:500;}
.qty-control{display:flex;align-items:center;gap:6px;background:#f0f7f0;border-radius:20px;padding:2px;border:1px solid #a8d8a8;}
.qty-btn{width:24px;height:24px;border-radius:50%;border:none;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.qty-btn.minus{background:#d4ecd4;color:#2d6a2d;}
.qty-btn.plus{background:#2d6a2d;color:#c8f0a0;}
.qty-num{font-weight:600;font-size:15px;min-width:16px;text-align:center;}
.add-btn{background:#2d6a2d;color:#c8f0a0;border:none;border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer;}
.sold-out-btn{background:#ccc;color:#fff;border:none;border-radius:20px;padding:5px 12px;font-size:12px;}
.opt-label{font-size:13px;color:#5a7a5a;font-weight:500;margin-top:12px;}
.addon-row,.sauce-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.addon-btn,.sauce-btn{border:1px solid #a8d8a8;background:#f0f7f0;color:#2d6a2d;border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer;}
.addon-btn.selected,.sauce-btn.selected{background:#2d6a2d;color:#fff;border-color:#2d6a2d;}
.opt-qty-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.admin-actions{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.btn-so{border:none;border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer;background:#ff9800;color:#fff;}
.btn-uso{background:#4a9e4a;}
.btn-del{border:none;border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer;background:#e53e3e;color:#fff;}
.overlay{position:fixed;inset:0;background:rgba(26,58,26,0.5);z-index:200;display:none;}
.panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:18px 18px 30px;z-index:201;max-height:85vh;overflow-y:auto;display:none;}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #d4ecd4;}
.panel-title{font-family:'Noto Serif TC',serif;font-size:19px;font-weight:700;color:#1a3a1a;}
.close-btn{background:#d4ecd4;border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;color:#2d6a2d;}
.pickup-info{background:#e3f2e0;border-radius:10px;padding:10px 12px;font-size:14px;color:#2d6a2d;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.link-btn{background:none;border:1px solid #2d6a2d;color:#2d6a2d;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap;}
.cart-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eaf4ea;}
.cart-item-info{flex:1;}
.cart-item-name{font-size:15px;font-weight:500;color:#1a3a1a;}
.cart-item-sub{font-size:13px;color:#4a9e4a;margin-top:2px;}
.empty-cart{text-align:center;padding:36px 0;color:#5a7a5a;font-size:13px;}
.cart-summary{background:#f0f7f0;border-radius:10px;padding:14px;margin:14px 0;}
.summary-row{display:flex;justify-content:space-between;font-size:14px;color:#5a7a5a;margin-bottom:5px;}
.summary-total{display:flex;justify-content:space-between;font-size:17px;font-weight:700;color:#1a3a1a;margin-top:8px;padding-top:8px;border-top:1px solid #a8d8a8;}
.field-label{font-size:13px;color:#5a7a5a;margin-bottom:5px;margin-top:10px;display:block;font-weight:500;}
.field-input{width:100%;border:1px solid #a8d8a8;border-radius:8px;padding:8px 12px;font-size:15px;color:#1a3a1a;background:#f0f7f0;outline:none;font-family:'Noto Sans TC',sans-serif;}
.note-input{width:100%;border:1px solid #a8d8a8;border-radius:8px;padding:8px 12px;font-size:14px;color:#1a3a1a;background:#f0f7f0;resize:none;outline:none;font-family:'Noto Sans TC',sans-serif;}
.time-select{width:100%;border:1px solid #a8d8a8;border-radius:8px;padding:8px 12px;font-size:15px;color:#1a3a1a;background:#f0f7f0;outline:none;font-family:'Noto Sans TC',sans-serif;}
.order-btn{width:100%;background:linear-gradient(135deg,#2d6a2d,#4a9e4a);color:#fff;border:none;border-radius:12px;padding:14px;font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;letter-spacing:2px;cursor:pointer;margin-top:12px;}
.order-btn:disabled{opacity:0.6;}
.confirm-btn{background:#2d6a2d;color:#fff;border:none;border-radius:10px;padding:10px;font-size:13px;cursor:pointer;width:100%;margin-top:8px;}
.cancel-btn{background:#ddd;color:#555;border:none;border-radius:10px;padding:10px;font-size:13px;cursor:pointer;width:100%;margin-top:6px;}
.checkbox-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px;}
.saving-msg{text-align:center;font-size:12px;color:#5a7a5a;margin-top:8px;}
.warn-msg{text-align:center;font-size:13px;color:#e53e3e;margin-top:8px;}
.success-overlay{position:fixed;inset:0;background:rgba(26,58,26,0.85);z-index:300;display:none;align-items:center;justify-content:center;}
.success-box{background:#fff;border-radius:18px;padding:36px 28px;text-align:center;max-width:300px;width:88%;}
.success-icon{font-size:50px;margin-bottom:12px;}
.success-title{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:700;color:#1a3a1a;margin-bottom:6px;}
.success-msg{font-size:15px;color:#5a7a5a;line-height:1.6;margin-bottom:20px;}
.success-btn{background:#2d6a2d;color:#c8f0a0;border:none;border-radius:10px;padding:10px 28px;font-size:13px;cursor:pointer;}
.pwd-overlay{position:fixed;inset:0;background:rgba(26,58,26,0.85);z-index:400;display:none;align-items:center;justify-content:center;}
.pwd-box{background:#fff;border-radius:18px;padding:30px 24px;text-align:center;max-width:280px;width:88%;}
.pwd-title{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;color:#1a3a1a;margin-bottom:16px;}
.pwd-input{width:100%;border:1px solid #a8d8a8;border-radius:8px;padding:10px 12px;font-size:16px;color:#1a3a1a;background:#f0f7f0;outline:none;text-align:center;letter-spacing:4px;margin-bottom:12px;}
.pwd-btn{background:#2d6a2d;color:#fff;border:none;border-radius:10px;padding:10px 28px;font-size:13px;cursor:pointer;margin-right:8px;}
.pwd-cancel{background:#ddd;color:#555;border:none;border-radius:10px;padding:10px 20px;font-size:13px;cursor:pointer;}
.pwd-error{color:#e53e3e;font-size:12px;margin-top:8px;}
</style>
</head>
<body>
<div class="header">
  <img class="header-banner" src="img-banner.jpg" alt="如意樂活蔬食早午餐" onclick="adminClick()"/>
  <div class="header-bottom">
    <div class="header-sub" id="biz-hours">餐點全素・蛋奶素者都可以吃・現點現做</div>
    <button class="cart-btn" onclick="openCart()">購物車 <span class="cart-badge" id="cart-count" style="display:none">0</span></button>
  </div>
  <div class="mode-tabs" id="mode-tabs"></div>
  <div class="cat-tabs" id="cat-tabs"></div>
</div>
<div id="admin-bar" style="display:none" class="admin-bar">
  <span>&#9881; 管理模式</span>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button onclick="openAddCat()">新增分類</button>
    <button onclick="saveMenuToGithub(function(){alert('已儲存！');})">儲存到雲端</button>
    <button id="close-btn-toggle" onclick="toggleClose()" style="background:#e53e3e">關閉今日點餐</button>
    <button onclick="exitAdmin()">離開</button>
  </div>
</div>
<div id="notice" class="notice" style="display:none"></div>
<div class="content" id="menu-content"></div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="cart-panel">
  <div class="panel-header"><div class="panel-title">我的訂單</div><button class="close-btn" onclick="closePanel()">X</button></div>
  <div id="cart-body"></div>
</div>
<div class="panel" id="opt-panel">
  <div class="panel-header"><div class="panel-title" id="opt-title"></div><button class="close-btn" onclick="closePanel()">X</button></div>
  <div id="opt-body"></div>
</div>
<div class="panel" id="add-item-panel">
  <div class="panel-header"><div class="panel-title" id="add-item-title">新增品項</div><button class="close-btn" onclick="closePanel()">X</button></div>
  <label class="field-label">品項名稱</label>
  <input class="field-input" id="new-name" placeholder="例：起士蛋餅"/>
  <label class="field-label">價格（元）</label>
  <input class="field-input" id="new-price" type="number" placeholder="例：38"/>
  <label class="field-label">描述</label>
  <input class="field-input" id="new-desc" placeholder="例：濃郁起士，香氣滿溢"/>
  <div class="checkbox-row"><input type="checkbox" id="new-hot"/><label for="new-hot">標記為熱銷</label></div>
  <button class="confirm-btn" onclick="saveNewItem()">新增</button>
  <button class="cancel-btn" onclick="closePanel()">取消</button>
</div>
<div class="panel" id="add-cat-panel">
  <div class="panel-header"><div class="panel-title">新增分類</div><button class="close-btn" onclick="closePanel()">X</button></div>
  <label class="field-label">分類名稱</label>
  <input class="field-input" id="new-cat-name" placeholder="例：特餐"/>
  <div class="checkbox-row"><input type="checkbox" id="new-cat-sauce"/><label for="new-cat-sauce">此分類有醬料選項</label></div>
  <button class="confirm-btn" onclick="saveNewCat()">新增分類</button>
  <button class="cancel-btn" onclick="closePanel()">取消</button>
</div>
<div class="success-overlay" id="success-overlay">
  <div class="success-box">
    <div class="success-icon">&#x1F389;</div>
    <div class="success-title">訂單成立！</div>
    <div class="success-msg" id="success-msg"></div>
    <button class="success-btn" onclick="closeSuccess()">繼續點餐</button>
  </div>
</div>
<div class="pwd-overlay" id="pwd-overlay">
  <div class="pwd-box">
    <div class="pwd-title">輸入管理密碼</div>
    <input class="pwd-input" id="pwd-input" type="password" maxlength="20" onkeydown="if(event.key==='Enter')checkPwd()"/>
    <div id="pwd-error" class="pwd-error" style="display:none">密碼錯誤</div>
    <div style="margin-top:12px">
      <button class="pwd-btn" id="pwd-btn" onclick="checkPwd()">確認</button>
      <button class="pwd-cancel" onclick="closePwd()">取消</button>
    </div>
  </div>
</div>

/* ========== 日期與營業時間 ========== */
function pad(n){return (n<10?"0":"")+n;}
function dateKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function todayKey(){return dateKey(new Date());}
function dateLabel(d){return (d.getMonth()+1)+"/"+d.getDate()+"（"+WEEK[d.getDay()]+"）";}
function startOfDay(d){var x=new Date(d);x.setHours(0,0,0,0);return x;}
function hoursFor(d){
  var day=d.getDay();
  if(day===0)return null;                        // 週日公休
  return {open:6*60+30,close:(day===6?11:13)*60};// 平日到13:00，週六到11:00
}
function slotsFor(d,isToday){
  var h=hoursFor(d);if(!h)return [];
  var start=h.open;
  if(isToday){
    var now=new Date();var nm=now.getHours()*60+now.getMinutes();
    start=Math.max(start,Math.ceil(nm/15)*15+15);
  }
  var out=[];
  for(var t=start;t<h.close;t+=15)out.push(pad(Math.floor(t/60))+":"+pad(t%60));
  return out;
}
function nextBizDay(){
  var d=startOfDay(new Date());
  do{d.setDate(d.getDate()+1);}while(d.getDay()===0);
  return d;
}
function preLabel(){
  var nb=nextBizDay();var tmr=startOfDay(new Date());tmr.setDate(tmr.getDate()+1);
  return (dateKey(nb)===dateKey(tmr)?"明天 ":"")+dateLabel(nb);
}
function targetDate(){return orderMode==="pre"?nextBizDay():startOfDay(new Date());}
function isClosedToday(){return settings.closedDate===todayKey();}
function isSoldOutToday(id){return !!(settings.soldOut&&settings.soldOut[id]===todayKey());}
function todayAvailable(){return !isClosedToday()&&slotsFor(new Date(),true).length>0;}
// 售完只影響今天的訂單，預訂明天不受影響
function itemBlocked(id){return orderMode==="today"&&isSoldOutToday(id);}

/* ========== 菜單資料 ========== */
function buildEmojiMap(){
  var map={};
  for(var s=0;s<menu.length;s++)for(var i=0;i<menu[s].items.length;i++){
    var it=menu[s].items[i];map[it.id]={emoji:it.emoji,customImg:it.customImg};
  }
  return map;
}
function buildImap(){
  var m={};for(var s=0;s<menu.length;s++)for(var i=0;i<menu[s].items.length;i++){var it=menu[s].items[i];m[it.id]=it;}return m;
}
function secOf(id){
  id=Number(id);
  for(var s=0;s<menu.length;s++)for(var i=0;i<menu[s].items.length;i++)if(menu[s].items[i].id===id)return menu[s];
  return null;
}
function hasOptions(id){var sec=secOf(id);return !!(sec&&(sec.hasSauce||sec.hasAddons));}
// 蛋餅只能加起士；吐司可以加起士或加蛋
function getOpts(id){var sec=secOf(id);if(!sec||!sec.hasAddons)return [];return sec.hasSauce?addonOptionsEggCrepe:addonOptions;}

function applyMenuData(d){
  if(!d||!d.menu)return;
  var cats=null;
  if(Array.isArray(d.menu)){cats=d.menu;}                 // 舊格式
  else if(d.menu.categories){                              // 新格式
    cats=d.menu.categories;
    if(d.menu.settings){settings=d.menu.settings;if(!settings.soldOut)settings.soldOut={};}
  }
  if(!cats||!cats.length)return;
  var emojiMap=buildEmojiMap();
  for(var s=0;s<cats.length;s++)for(var i=0;i<cats[s].items.length;i++){
    var e=emojiMap[cats[s].items[i].id];
    if(e){if(e.emoji)cats[s].items[i].emoji=e.emoji;if(e.customImg)cats[s].items[i].customImg=e.customImg;}
  }
  menu=cats;menuSha=d.sha||menuSha;
  if(activeCat>=menu.length)activeCat=-1;
}
var firstLoad=true;
function loadMenu(){
  return fetch(MENU_API+"?t="+Date.now(),{cache:"no-store"})
    .then(function(r){return r.json();})
    .then(function(d){applyMenuData(d);})
    .catch(function(){})
    .then(function(){
      if(firstLoad){firstLoad=false;if(!modeTouched&&!todayAvailable())orderMode="pre";}
      render();
    });
}

function saveMenuToGithub(callback){
  if(!menuSha){alert("菜單尚未載入完成，請重新整理頁面再試");return;}
  // 清掉過期的每日狀態
  var tk=todayKey();var so={};
  for(var k in settings.soldOut)if(settings.soldOut[k]===tk)so[k]=tk;
  settings.soldOut=so;
  if(settings.closedDate!==tk)settings.closedDate="";
  fetch(MENU_API,{method:"PUT",headers:{"Content-Type":"application/json","x-admin-password":adminPwd},body:JSON.stringify({menu:{categories:menu,settings:settings},sha:menuSha})})
  .then(function(r){
    return r.json().catch(function(){return {};}).then(function(d){
      if(r.status===401)throw new Error("密碼驗證失敗，請重新進入管理模式");
      if(r.status===409)throw new Error("菜單已在其他裝置被修改，請重新整理頁面後再操作");
      if(!r.ok)throw new Error(d.error||("HTTP "+r.status));
      if(d.sha)menuSha=d.sha;
      if(callback)callback();
    });
  })
  .catch(function(e){alert("儲存失敗："+e.message);});
}

function nextId(){
  var max=0;
  for(var s=0;s<menu.length;s++)for(var i=0;i<menu[s].items.length;i++)if(menu[s].items[i].id>max)max=menu[s].items[i].id;
  return max+1;
}

/* ========== 購物車（同品項不同加料分開計算） ========== */
function lineKey(id,sauceVal,ad){
  var keys=[];for(var k in ad)if(ad[k])keys.push(k);keys.sort();
  return id+"|"+(sauceVal||"")+"|"+keys.join(",");
}
function addLine(id,sauceVal,ad,qty){
  id=Number(id);
  var clean={};for(var k in ad)if(ad[k])clean[k]=true;
  var key=lineKey(id,sauceVal,clean);
  for(var i=0;i<cartLines.length;i++)if(cartLines[i].key===key){cartLines[i].qty+=qty;return;}
  cartLines.push({key:key,id:id,sauce:sauceVal||"",addons:clean,qty:qty});
}
function totalQty(id){var t=0;for(var i=0;i<cartLines.length;i++)if(cartLines[i].id===id)t+=cartLines[i].qty;return t;}
function addonPriceOf(id,ad){var t=0;var o=getOpts(id);for(var k=0;k<o.length;k++)if(ad[o[k].key])t+=o[k].price;return t;}
function addonLabelOf(id,ad){var l=[];var o=getOpts(id);for(var k=0;k<o.length;k++)if(ad[o[k].key])l.push(o[k].label);return l.join("、");}

function addItem(id){
  if(itemBlocked(id))return;
  if(hasOptions(id)){openOpt(id);return;}
  addLine(id,"",{},1);render();
}
function decSimple(id){
  var key=lineKey(id,"",{});
  for(var i=0;i<cartLines.length;i++)if(cartLines[i].key===key){
    cartLines[i].qty--;if(cartLines[i].qty<=0)cartLines.splice(i,1);break;
  }
  render();
}
function changeLine(idx,d){
  if(!cartLines[idx])return;
  cartLines[idx].qty+=d;
  if(cartLines[idx].qty<=0)cartLines.splice(idx,1);
  renderCount();renderMenu();renderCart();
}

/* 加料／醬料選擇面板 */

  renderOpt();showPanel("opt-panel");
}
function optSauce(s){opt.sauce=s;renderOpt();}
function optAddon(k){opt.addons[k]=!opt.addons[k];renderOpt();}
function optQty(d){opt.qty=Math.max(1,opt.qty+d);renderOpt();}
function renderOpt(){
  var it=buildImap()[opt.id];var sec=secOf(opt.id);var o=getOpts(opt.id);
  document.getElementById("opt-title").textContent=it.name;
  var h='<div style="font-size:14px;color:#5a7a5a">'+it.desc+'</div>';
  if(o.length){
    h+='<div class="opt-label">加料</div><div class="addon-row">';
    for(var k=0;k<o.length;k++)h+='<button class="addon-btn '+(opt.addons[o[k].key]?'selected':'')+'" onclick="optAddon(\''+o[k].key+'\')">'+o[k].label+'</button>';
    h+='</div>';
  }
  if(sec.hasSauce){
    h+='<div class="opt-label">醬料</div><div class="sauce-row">';
    for(var k=0;k<sauceOptions.length;k++){var sv=sauceOptions[k];h+='<button class="sauce-btn '+(opt.sauce===sv?'selected':'')+'" onclick="optSauce(\''+sv+'\')">'+sv+'</button>';}
    h+='</div>';
  }
  var unit=it.price+addonPriceOf(opt.id,opt.addons);
  h+='<div class="opt-qty-row"><span style="font-size:14px;color:#5a7a5a">數量</span><div class="qty-control"><button class="qty-btn minus" onclick="optQty(-1)">-</button><span class="qty-num">'+opt.qty+'</span><button class="qty-btn plus" onclick="optQty(1)">+</button></div></div>';
  h+='<button class="order-btn" onclick="confirmOpt()">加入購物車　$'+(unit*opt.qty)+'</button>';
  document.getElementById("opt-body").innerHTML=h;
}
function confirmOpt(){
  addLine(opt.id,opt.sauce,opt.addons,opt.qty);
  opt=null;closePanel();render();
}

function openCart(){

  var td=targetDate();var h="";
  h+='<div class="pickup-info"><span>'+(orderMode==="pre"?'&#128197; 預訂取餐：':'&#128338; 今天取餐：')+dateLabel(td)+'</span>';
  if(orderMode==="today")h+='<button class="link-btn" onclick="setMode(\'pre\')">改預訂</button>';
  else if(todayAvailable())h+='<button class="link-btn" onclick="setMode(\'today\')">改今天</button>';
  h+='</div>';
  var tc=0,tp=0;
  for(var i=0;i<cartLines.length;i++){
    var l=cartLines[i];var it=imap[l.id];var up=it.price+addonPriceOf(l.id,l.addons);
    tc+=l.qty;tp+=up*l.qty;
    h+='<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">'+it.name+'</div>';
    if(l.sauce)h+='<div class="cart-item-sub">醬料：'+l.sauce+'</div>';
    var al=addonLabelOf(l.id,l.addons);if(al)h+='<div class="cart-item-sub">加購：'+al+'</div>';
    h+='<div class="cart-item-sub">$'+up+' x '+l.qty+'</div></div>';
    h+='<div class="qty-control"><button class="qty-btn minus" onclick="changeLine('+i+',-1)">-</button><span class="qty-num">'+l.qty+'</span><button class="qty-btn plus" onclick="changeLine('+i+',1)">+</button></div></div>';
  }
  h+='<div class="cart-summary"><div class="summary-row"><span>品項數量</span><span>'+tc+' 件</span></div><div class="summary-total"><span>合計</span><span>$'+tp+'</span></div></div>';
  var times=slotsFor(td,orderMode==="today");
  h+='<label class="field-label">取餐時間</label><select class="time-select" id="pickup-time"><option value="">請選擇取餐時間</option>';
  for(var i=0;i<times.length;i++)h+='<option>'+times[i]+'</option>';
  h+='</select>';
  if(times.length===0)h+='<div class="warn-msg">今天已無可取餐時段，請改為預訂</div>';
  h+='<label class="field-label">手機號碼</label><input class="field-input" id="phone-input" type="tel" inputmode="numeric" maxlength="12" placeholder="例：0912345678"/>';
  h+='<label class="field-label">備註（外帶/內用桌號/特殊需求）</label><textarea class="note-input" id="note-input" rows="2" placeholder="例：外帶、內用3號桌..."></textarea>';
  h+='<div class="saving-msg" id="sending-msg" style="display:none">傳送中...</div>';
  h+='<button class="order-btn" id="order-btn" onclick="placeOrder()"'+(times.length===0?' disabled':'')+'>'+(orderMode==="pre"?'確認預訂':'立即下單')+'</button>';
  body.innerHTML=h;
  restoreForm();
}

function setSending(on,text){
  var b=document.getElementById("order-btn");var m=document.getElementById("sending-msg");
  if(b)b.disabled=on;
  if(m){m.style.display=on?"block":"none";if(text)m.textContent=text;}
}
function placeOrder(){
  if(cartLines.length===0)return;
  var phoneRaw=document.getElementById("phone-input").value.trim();
  var digits=phoneRaw.replace(/\D/g,"");
  if(!/^09\d{8}$/.test(digits)){alert("請輸入正確的手機號碼（09 開頭共 10 碼）");return;}
  var time=document.getElementById("pickup-time").value;
  if(!time){alert("請選擇取餐時間！");return;}
  var note=document.getElementById("note-input").value;
  var mode=orderMode;
  saveForm();
  setSending(true,"確認中...");

  // 下單前重新抓雲端狀態，確認沒有臨時關閉或售完
  loadMenu().then(function(){
    var imap=buildImap();
    var missing=cartLines.filter(function(l){return !imap[l.id];});
    if(missing.length){removeLinesOf(missing.map(function(l){return l.id;}));renderCount();renderCart();alert("部分餐點已下架，已從購物車移除，請確認後再下單。");return;}
    if(mode==="today"){
      if(isClosedToday()){renderCart();alert("很抱歉，今日已暫停點餐，可改為預訂 "+preLabel()+"。");return;}
      var soldIds=cartLines.filter(function(l){return isSoldOutToday(l.id);}).map(function(l){return l.id;});
      if(soldIds.length){removeLinesOf(soldIds);renderCount();renderMenu();renderCart();alert("部分餐點剛剛售完，已從購物車移除，請確認後再下單。");return;}
      if(slotsFor(new Date(),true).indexOf(time)<0){formCache["pickup-time"]="";renderCart();alert("您選的取餐時間已經過了，請重新選擇。");return;}
    }
    var td=mode==="pre"?nextBizDay():startOfDay(new Date());
    var items=cartLines.map(function(l){
      var it={id:l.id,name:imap[l.id].name,price:imap[l.id].price,qty:l.qty};
      if(l.sauce)it.sauce=l.sauce;
      var al=addonLabelOf(l.id,l.addons);if(al)it.addons=al;
      var ap=addonPriceOf(l.id,l.addons);if(ap)it.addonPrice=ap;
      return it;
    });
    var total=items.reduce(function(s,i){return s+(i.price+(i.addonPrice||0))*i.qty;},0);
    var oid=digits.slice(-3);
    var pickupText=(mode==="pre"?"【預訂】":"")+dateLabel(td)+" "+time;
    setSending(true,"送出中...");
    return fetch(NOTIFY_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      items:items,total:total,note:note,orderId:oid,phone:digits,
      pickup:pickupText,pickupDate:dateKey(td),pickupTime:time,preorder:mode==="pre"
    })})
    .then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status);
      cartLines=[];formCache={"phone-input":phoneRaw};
      document.getElementById("cart-body").innerHTML="";
      closePanel();render();
      document.getElementById("success-msg").innerHTML=(mode==="pre"?"預訂成功！":"感謝您的訂購！")+"<br>訂單編號：#"+oid+"<br>取餐時間："+dateLabel(td)+" "+time+"<br>"+(mode==="pre"?"當天我們會準時為您準備":"請稍候，我們盡快為您準備");
      document.getElementById("success-overlay").style.display="flex";
    });
  })
  .catch(function(e){
    console.error(e);
    setSending(false);
    alert("訂單送出失敗，請再試一次，或直接致電店家點餐。");
  })
  .then(function(){
    var b=document.getElementById("order-btn");
    if(b&&b.disabled&&document.getElementById("cart-panel").style.display==="block"){
      // 驗證未通過時恢復按鈕
      var times=slotsFor(targetDate(),orderMode==="today");
      if(times.length)setSending(false);
    }
  });
}

// 顯示今日營業時間
(function(){
  var day=new Date().getDay();
  var el=document.getElementById("biz-hours");
  if(day===0)el.textContent="今日公休（週日）・可預訂週一";
  else if(day===6)el.textContent="今日營業：06:30-11:00（週六）";
  else el.textContent="今日營業：06:30-13:00（平日）";
})();
if(!todayAvailable())orderMode="pre";
render();
loadMenu();
</script>
